spring.datasource.url=jdbc:sqlite:./data/trak.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# TEMPORARY EXPERIMENT: route Instant via TimestampJdbcType (no shared Calendar).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080
# Bind to loopback only. Without this Spring Boot binds 0.0.0.0, which exposes
# the unauthenticated browsing-history API to every device on the local network.
server.address=127.0.0.1

# No automatic retention: browsing data is kept until the user erases it from
# the app (DELETE /api/sessions/all).
# Secure deletion: zero freed pages so erased URLs/queries are not recoverable
# from the raw SQLite file. secure_delete is per-connection, so it is applied to
# every pooled connection here as well as on the bootstrap connection.
spring.datasource.hikari.connection-init-sql=PRAGMA secure_delete=ON
